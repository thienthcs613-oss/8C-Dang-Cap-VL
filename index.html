<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz & Gacha Lootbox Magic Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at center, #2b1055, #110224);
            font-family: 'Montserrat', 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* BACKGROUND FALLING CANVAS */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        /* MÀN HÌNH ĐẾM NGƯỢC OVERLAY */
        #countdownOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(17, 2, 36, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            cursor: pointer;
        }

        .start-prompt {
            font-size: 1.5rem;
            color: #ffd700;
            font-weight: bold;
            animation: pulseText 1.2s infinite alternate;
            text-align: center;
            padding: 20px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        @keyframes pulseText {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        .countdown-num {
            font-size: 8rem;
            font-weight: 900;
            background: linear-gradient(180deg, #fff2a3, #ffd700, #ffa500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            display: none;
            animation: popIn 0.8s ease-out forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.2); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* CONTAINER DÙNG CHUNG */
        .content-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        /* HIỆU ỨNG RUNG KHUNG BÁO SAI */
        .shake-error {
            animation: shakeErrorAnim 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shakeErrorAnim {
            0% { transform: translateX(0) rotate(0deg); }
            15% { transform: translateX(-16px) rotate(-3deg); }
            30% { transform: translateX(14px) rotate(2.5deg); }
            45% { transform: translateX(-12px) rotate(-2deg); }
            60% { transform: translateX(8px) rotate(1.5deg); }
            75% { transform: translateX(-4px) rotate(-1deg); }
            100% { transform: translateX(0) rotate(0deg); }
        }

        h1 {
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #fff2a3, #ffd700, #ffa500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #bfa8e6;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
            text-shadow: 0 0 10px rgba(191, 168, 230, 0.5);
        }

        /* KHU VỰC CÂU HỎI TRẮC NGHIỆM */
        .quiz-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 3px solid rgba(255, 215, 0, 0.35);
            border-radius: 16px;
            padding: 25px 30px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 15px rgba(255, 215, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
            will-change: transform;
            transition: border-color 1s ease, background-color 1s ease, box-shadow 1s ease;
        }

        .quiz-card.correct-border {
            border-color: #2ecc71 !important;
            background: rgba(46, 204, 113, 0.15) !important;
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.6) !important;
            transition: border-color 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .quiz-card.wrong-border {
            border-color: #ff3333 !important;
            background: rgba(255, 51, 51, 0.25) !important;
            box-shadow: 0 0 35px rgba(255, 51, 51, 0.8) !important;
            transition: border-color 0s, background-color 0s, box-shadow 0s;
        }

        .quiz-card.fade-out-error {
            border-color: rgba(255, 215, 0, 0.35) !important;
            background: rgba(255, 255, 255, 0.08) !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important;
            transition: border-color 1s ease, background-color 1s ease, box-shadow 1s ease !important;
        }

        .question-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(5px);
        }

        .option-btn:hover {
            background: rgba(255, 215, 0, 0.2);
            border-color: rgba(255, 215, 0, 0.6);
            transform: translateY(-2px);
        }

        .option-btn:active {
            transform: scale(0.97);
            background: rgba(255, 215, 0, 0.4);
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 0.95rem;
            text-align: center;
            height: 20px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .error-msg.show-text {
            opacity: 1;
            transition: opacity 0s;
        }

        .game-stage {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .stage {
            position: relative;
            width: 320px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glow-bg {
            position: absolute;
            width: 290px;
            height: 290px;
            background: radial-gradient(circle, rgba(255,215,0,0.35) 0%, rgba(255,215,0,0) 70%);
            border-radius: 50%;
            animation: pulseGlow 2s infinite alternate;
            z-index: 1;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.5; }
            100% { transform: scale(1.25); opacity: 0.9; }
        }

        .box-wrapper {
            position: relative;
            width: 180px;
            height: 120px;
            z-index: 2;
            cursor: pointer;
            transition: transform 0.15s ease-out, opacity 0.3s;
        }

        .box-body {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 90px;
            background: linear-gradient(135deg, #ff3b3b, #c0392b);
            border-radius: 12px;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.6), inset 0 4px 6px rgba(255, 255, 255, 0.3);
            border: 2px solid #ff7676;
        }

        .ribbon-v {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 100%;
            background: linear-gradient(90deg, #ffe066, #ffd700, #e6b800);
        }

        .box-lid {
            position: absolute;
            top: 15px;
            left: -8px;
            width: 196px;
            height: 32px;
            background: linear-gradient(135deg, #ff4d4d, #d63031);
            border-radius: 8px;
            border: 2px solid #ff8585;
            z-index: 3;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
        }

        .bow {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 20px;
            z-index: 4;
        }

        .bow::before, .bow::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 20px;
            background: #ffd700;
            border-radius: 12px 12px 0 12px;
        }

        .bow::before { left: 0; transform: rotate(-15deg); }
        .bow::after { right: 0; transform: rotate(15deg) scaleX(-1); }

        .bounce-shake {
            animation: bounceShake 0.35s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes bounceShake {
            0% { transform: scale(1) translateY(0) rotate(0deg); }
            20% { transform: scale(1.15) translateY(-15px) rotate(-6deg); }
            40% { transform: scale(1.1) translateY(-10px) rotate(6deg); }
            60% { transform: scale(1.05) translateY(-5px) rotate(-3deg); }
            80% { transform: scale(1.02) translateY(-2px) rotate(2deg); }
            100% { transform: scale(1) translateY(0) rotate(0deg); }
        }

        .open-lid {
            transform: translateY(-120px) rotate(-35deg) scale(0.9) !important;
            opacity: 0;
        }

        .reward-card {
            position: absolute;
            z-index: 10;
            background: linear-gradient(145deg, #2a2a4a, #181830);
            border: 3px solid #ffd700;
            border-radius: 16px;
            padding: 20px 30px;
            text-align: center;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.7);
            transform: scale(0);
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s;
            pointer-events: none;
        }

        .reward-card.show {
            transform: scale(1.1);
            opacity: 1;
            pointer-events: auto;
        }

        .reward-icon {
            font-size: 3.8rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px rgba(255,215,0,0.5));
        }

        .reward-title {
            font-size: 1.25rem;
            color: #ffd700;
            font-weight: bold;
        }

        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .next-btn {
            margin-top: 20px;
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(180deg, #2ecc71, #27ae60);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
            transition: transform 0.15s ease, background 0.3s;
        }

        .next-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(180deg, #34d07b, #2ecc71);
        }

        .next-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- CANVAS BACKGROUND HIỆU ỨNG SAO & KIM TUYẾN RƠI -->
    <canvas id="bgCanvas"></canvas>

    <!-- MÀN HÌNH ĐẾM NGƯỢC OVERLAY -->
    <div id="countdownOverlay" onclick="startCountdown()">
        <div class="start-prompt" id="startPrompt">👉 CHẠM VÀO MÀN HÌNH ĐỂ BẮT ĐẦU 👈</div>
        <div class="countdown-num" id="countdownNum">3</div>
    </div>

    <!-- MÀN HÌNH TRẮC NGHIỆM -->
    <div id="quizSection" class="content-container" style="display: none;">
        <h1>CÂU HỎI THỬ THÁCH</h1>
        <div class="subtitle" id="quizProgress">Câu hỏi 1/5</div>

        <div class="quiz-card" id="quizCard">
            <div class="question-title" id="questionText">Nội dung câu hỏi...</div>
            <div class="options-grid" id="optionsContainer"></div>
            <div class="error-msg" id="errorMsg">❌ Sai rồi! Hãy thử chọn lại nhé.</div>
        </div>
    </div>

    <!-- MÀN HÌNH MỞ HỘP QUÀ -->
    <div class="game-stage content-container" id="gameSection">
        <h1 id="rewardHeaderTitle">PHẦN THƯỞNG CỦA BẠN</h1>
        <div class="subtitle" id="statusText">Chạm 3 lần để mở hộp quà! (0/3)</div>

        <div class="stage">
            <div class="glow-bg"></div>
            <canvas id="particleCanvas"></canvas>

            <div class="box-wrapper" id="boxWrapper">
                <div class="box-lid" id="boxLid">
                    <div class="bow"></div>
                    <div class="ribbon-v"></div>
                </div>
                <div class="box-body">
                    <div class="ribbon-v"></div>
                </div>
            </div>

            <div class="reward-card" id="rewardCard">
                <div class="reward-icon" id="rewardIcon">🎁</div>
                <div class="reward-title" id="rewardText">Chúc bạn may mắn lần sau!</div>
            </div>
        </div>

        <button class="next-btn" id="nextBtn" style="display: none;" onclick="continueGame()">Tiếp Tục</button>
    </div>

    <script>
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');

        function resizeBgCanvas() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeBgCanvas);
        resizeBgCanvas();

        // TẠO CÁC HẠT KIM TUYẾN/TÂY/SAO RƠI TRÊN NỀN
        const bgParticles = [];
        const numBgParticles = 80;

        for (let i = 0; i < numBgParticles; i++) {
            bgParticles.push({
                x: Math.random() * bgCanvas.width,
                y: Math.random() * bgCanvas.height,
                radius: Math.random() * 2.5 + 0.5,
                vy: Math.random() * 1.2 + 0.3,
                vx: (Math.random() - 0.5) * 0.5,
                alpha: Math.random(),
                dAlpha: (Math.random() * 0.02 + 0.005) * (Math.random() < 0.5 ? 1 : -1),
                color: `hsl(${Math.random() * 60 + 40}, 100%, 75%)` // Tông vàng/kim tuyến lấp lánh
            });
        }

        function drawSparkle(ctx, cx, cy, spikes, outerRadius, innerRadius, fillStyle) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fillStyle = fillStyle;
            ctx.fill();
        }

        function animateBgParticles() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

            bgParticles.forEach(p => {
                p.y += p.vy;
                p.x += p.vx;
                p.alpha += p.dAlpha;

                if (p.alpha <= 0.1 || p.alpha >= 0.95) p.dAlpha = -p.dAlpha;

                if (p.y > bgCanvas.height) {
                    p.y = -10;
                    p.x = Math.random() * bgCanvas.width;
                }
                if (p.x > bgCanvas.width) p.x = 0;
                if (p.x < 0) p.x = bgCanvas.width;

                bgCtx.save();
                bgCtx.globalAlpha = Math.max(0, p.alpha);
                
                // Vẽ ngôi sao lấp lánh hoặc hạt kim tuyến tròn
                if (p.radius > 2) {
                    drawSparkle(bgCtx, p.x, p.y, 4, p.radius * 2.5, p.radius * 0.8, p.color);
                } else {
                    bgCtx.beginPath();
                    bgCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    bgCtx.fillStyle = p.color;
                    bgCtx.shadowBlur = 8;
                    bgCtx.shadowColor = p.color;
                    bgCtx.fill();
                }
                bgCtx.restore();
            });

            requestAnimationFrame(animateBgParticles);
        }
        animateBgParticles();

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playTickSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playGoSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        function playCorrectSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const now = audioCtx.currentTime;
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc1.type = 'sine';
            osc2.type = 'sine';

            osc1.frequency.setValueAtTime(587.33, now);
            osc2.frequency.setValueAtTime(880, now + 0.1);

            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(audioCtx.destination);

            osc1.start(now);
            osc1.stop(now + 0.1);
            osc2.start(now + 0.1);
            osc2.stop(now + 0.35);
        }

        function playWrongSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.25);

            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.25);
        }

        const quizData = [
            {
                question: "Câu 1: Ai óc chó nhất lớp?",
                options: ["A. Thư", "B. Nhật Minh", "C. Thịnh", "D. Hào"],
                correct: 1
            },
            {
                question: "Câu 2: Ai đẹp trai nhất lớp?",
                options: ["A. Kiệt", "B. Tiến", "C. Chức", "D. Thế Bảo"],
                correct: 2
            },
            {
                question: "Câu 3: Ai xấu tính nhất lớp?",
                options: ["A. Không biết", "B. Ai hỏi?", "C. Chính là tôi", "D. Biển ơi... "],
                correct: 0
            },
            {
                question: "Câu 4: Thông minh nhất lớp?",
                options: ["A. Thằng tạo ra web này ", "B. Ánh già", "C. Hoàng Văn Minh Hiếu", "D. Chính là tôi"],
                correct: 0
            },
            {
                question: "Câu 5: Ai hài nhất lớp?",
                options: ["A. Gia bảo", "B. Kiệt", "C. Hải", "D. Khánh Toàn"],
                correct: 3
            }
        ];

        let currentQuestion = 0;
        let isAnswering = false;
        let fadeTimeout = null;
        let countdownStarted = false;

        const countdownOverlay = document.getElementById('countdownOverlay');
        const startPrompt = document.getElementById('startPrompt');
        const countdownNum = document.getElementById('countdownNum');
        const quizSection = document.getElementById('quizSection');
        const gameSection = document.getElementById('gameSection');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const quizProgress = document.getElementById('quizProgress');
        const errorMsg = document.getElementById('errorMsg');
        const quizCard = document.getElementById('quizCard');

        function startCountdown() {
            if (countdownStarted) return;
            countdownStarted = true;
            
            startPrompt.style.display = 'none';
            countdownNum.style.display = 'block';

            let count = 3;
            countdownNum.textContent = count;
            playTickSound();

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownNum.textContent = count;
                    countdownNum.style.animation = 'none';
                    void countdownNum.offsetWidth;
                    countdownNum.style.animation = 'popIn 0.8s ease-out forwards';
                    playTickSound();
                } else if (count === 0) {
                    countdownNum.textContent = "GO!";
                    countdownNum.style.animation = 'none';
                    void countdownNum.offsetWidth;
                    countdownNum.style.animation = 'popIn 0.8s ease-out forwards';
                    playGoSound();
                } else {
                    clearInterval(timer);
                    countdownOverlay.style.display = 'none';
                    quizSection.style.display = 'flex';
                    loadQuestion();
                }
            }, 1000);
        }

        function loadQuestion() {
            isAnswering = false;
            quizCard.className = 'quiz-card';
            errorMsg.classList.remove('show-text');
            
            const q = quizData[currentQuestion];
            quizProgress.textContent = `Câu hỏi ${currentQuestion + 1}/${quizData.length}`;
            questionText.textContent = q.question;
            optionsContainer.innerHTML = "";

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(index);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex) {
            if (isAnswering) return;
            isAnswering = true;

            clearTimeout(fadeTimeout);
            quizCard.classList.remove('correct-border', 'wrong-border', 'fade-out-error', 'shake-error');
            errorMsg.classList.remove('show-text');

            if (selectedIndex === quizData[currentQuestion].correct) {
                quizCard.classList.add('correct-border');
                playCorrectSound();
                
                setTimeout(() => {
                    quizSection.style.display = 'none';
                    setupBoxScreen();
                    gameSection.style.display = 'flex';
                }, 600);
            } else {
                void quizCard.offsetWidth; 
                quizCard.classList.add('wrong-border', 'shake-error');
                errorMsg.classList.add('show-text');
                playWrongSound();

                fadeTimeout = setTimeout(() => {
                    quizCard.classList.remove('wrong-border', 'shake-error');
                    quizCard.classList.add('fade-out-error');
                    errorMsg.classList.remove('show-text');
                    
                    setTimeout(() => {
                        quizCard.classList.remove('fade-out-error');
                        isAnswering = false;
                    }, 1000);
                }, 400);
            }
        }

        let clickCount = 0;
        const maxClicks = 3;

        const boxWrapper = document.getElementById('boxWrapper');
        const boxLid = document.getElementById('boxLid');
        const statusText = document.getElementById('statusText');
        const rewardCard = document.getElementById('rewardCard');
        const rewardIcon = document.getElementById('rewardIcon');
        const rewardText = document.getElementById('rewardText');
        const nextBtn = document.getElementById('nextBtn');
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 320;
        canvas.height = 280;

        function setupBoxScreen() {
            clickCount = 0;
            boxWrapper.style.opacity = '1';
            boxLid.classList.remove('open-lid');
            rewardCard.classList.remove('show');
            nextBtn.style.display = 'none';
            statusText.textContent = `Chạm 3 lần để nhận quà cho câu ${currentQuestion + 1}! (0/3)`;
            
            if (currentQuestion + 1 === quizData.length) {
                nextBtn.textContent = "Hoàn Thành Tất Cả";
            } else {
                nextBtn.textContent = "Câu Hỏi Tiếp Theo";
            }
        }

        function playHitSound(step) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const pitchMap = { 1: 220, 2: 330, 3: 523 };
            const baseFreq = pitchMap[step] || 220;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, audioCtx.currentTime + 0.18);
            gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.18);
        }

        function playWinSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.08);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime + i * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.08 + 0.35);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + i * 0.08);
                osc.stop(audioCtx.currentTime + i * 0.08 + 0.35);
            });
        }

        function getReward() {
            const rate = Math.floor(Math.random() * 100) + 1;
            if (rate <= 40) {
                return { text: "Bạn nhận được 1 viên kẹo ngọt!", icon: "🍬" };
            } else if (rate <= 80) {
                return { text: "Bạn nhận được 1 gói bim bim!", icon: "🍿" };
            } else {
                return { text: "Một nụ cười thật tươi! 😊", icon: "✨" };
            }
        }

        let particles = [];
        function createParticles() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            for (let i = 0; i < 70; i++) {
                particles.push({
                    x: centerX,
                    y: centerY,
                    vx: (Math.random() - 0.5) * 14,
                    vy: (Math.random() - 0.5) * 14 - 3,
                    size: Math.random() * 6 + 3,
                    color: `hsl(${Math.random() * 360}, 100%, 65%)`,
                    life: 1
                });
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.22;
                p.life -= 0.02;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fill();

                if (p.life <= 0) particles.splice(index, 1);
            });

            if (particles.length > 0) requestAnimationFrame(animateParticles);
        }

        boxWrapper.addEventListener('click', () => {
            if (clickCount >= maxClicks) return;
            clickCount++;
            
            playHitSound(clickCount);

            boxWrapper.classList.remove('bounce-shake');
            void boxWrapper.offsetWidth;
            boxWrapper.classList.add('bounce-shake');

            if (clickCount < maxClicks) {
                statusText.textContent = `Chạm tiếp nào! (${clickCount}/${maxClicks})`;
            } else {
                statusText.textContent = "ĐANG MỞ QUÀ!";
                setTimeout(() => {
                    boxLid.classList.add('open-lid');
                    createParticles();
                    animateParticles();
                    playWinSound();

                    const reward = getReward();
                    rewardIcon.textContent = reward.icon;
                    rewardText.textContent = reward.text;

                    setTimeout(() => {
                        boxWrapper.style.opacity = '0';
                        rewardCard.classList.add('show');
                        nextBtn.style.display = 'inline-block';
                        statusText.textContent = "ĐÃ MỞ THÀNH CÔNG!";
                    }, 300);
                }, 200);
            }
        });

        function continueGame() {
            currentQuestion++;

            if (currentQuestion < quizData.length) {
                gameSection.style.display = 'none';
                quizSection.style.display = 'flex';
                loadQuestion();
            } else {
                currentQuestion = 0;
                gameSection.style.display = 'none';
                quizSection.style.display = 'flex';
                loadQuestion();
            }
        }
    </script>
</body>
</html>
